services:
  ipfs:
    image: ipfs/kubo
    restart: unless-stopped
    ports:
      - 4001:4001/tcp
      - 4001:4001/udp
    volumes:
      - ipfs-staging:/export
      - ipfs-data:/data/ipfs
      - ./docker/ipfs-init:/container-init.d:ro
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cidindexer:
    build: .
    image: cidindexer-ipfs:datanetwork
    restart: unless-stopped
    depends_on:
      ipfs:
        condition: service_healthy
    ports:
      - "8384:8384"
    environment:
      SAIA_API_KEY: "${SAIA_API_KEY:-}"
    command:
      - "-o=/data"
      - "-ipfs-api=http://ipfs:5001"
      - "-datanetwork=https://www.iosp.science/datanetwork"
    volumes:
      - cidindexer-data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  ipfs-staging:
  ipfs-data:
  cidindexer-data:
